    function getDeviceToken() {
      let dt = localStorage.getItem('pbg_device_token');
      if (!dt) { dt = 'web_' + Math.random().toString(36).slice(2, 12) + '_' + Date.now(); localStorage.setItem('pbg_device_token', dt); }
      return dt;
    }

    function getToken() { return localStorage.getItem('pbg_token'); }
    function setSession(token, user) { localStorage.setItem('pbg_token', token); localStorage.setItem('pbg_user', JSON.stringify(user)); }
    function clearSession() { localStorage.removeItem('pbg_token'); localStorage.removeItem('pbg_user'); }

    class ApiError extends Error {
      constructor(message, status) { super(message); this.status = status; }
    }

    async function apiFetch(path, opts = {}) {
      const token = getToken();
      const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
      if (token) headers['Authorization'] = 'Bearer ' + token;
      const url = API_BASE + path;
      const res = await fetch(url, { ...opts, headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
      if (!res.ok) {
        let msg = 'Lỗi ' + res.status;
        try { const j = await res.json(); msg = j.detail || j.message || msg; } catch (_) {}
        throw new ApiError(msg, res.status);
      }
      if (res.status === 204) return null;
      return res.json();
    }

                          <div className="flex items-center gap-2 mb-2">

                    <div className="bg-white rounded-2xl border border-brand-border shadow-card overflow-x-auto">
                      <table className="w-full text-xs min-w-[600px]">
                        <thead>
                          <tr className="bg-brand-card border-b border-brand-border text-brand-textSecondary">
                            <th className="py-2.5 px-3 text-left font-bold">ID</th>
                            <th className="py-2.5 px-3 text-left font-bold">User</th>
                            <th className="py-2.5 px-3 text-left font-bold">Ngân hàng</th>
                            <th className="py-2.5 px-3 text-right font-bold">Số tiền</th>
                            <th className="py-2.5 px-3 text-center font-bold">Action</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-brand-border">
                          {pendingWithdrawals.length === 0 ? (
                            <tr><td colSpan="5" className="py-8 text-center text-brand-textSecondary">Không có yêu cầu rút tiền.</td></tr>

                                </div>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}

                  {/* Admin Leaderboard */}
                  {adminDashTab === 'bxh' && (

                            <th className="py-2.5 px-3 text-right font-bold">Đơn</th>

                            <tr key={i} className="hover:bg-brand-card transition">
                              <td className="py-2.5 px-3 font-black">{i + 1}</td>
                              <td className="py-2.5 px-3 font-semibold">{u.username}</td>
                              <td className="py-2.5 px-3 text-right font-bold">{u.total_orders || 0}</td>
                              <td className="py-2.5 px-3 text-right font-black text-brand-blue">{formatVND(u.total_gmv || u.total_cashback)}đ</td>
                            </tr>

                        </tbody>
                      </table>
                    </div>
                  )}

                  {/* Admin Banks */}
                  <div className="bg-white rounded-3xl border border-brand-border shadow-card p-4 space-y-3">

                      <h3 className="text-sm font-black text-brand-textPrimary flex items-center gap-2">
                        <i className="fa-solid fa-building-columns text-brand-blue"></i> Ngân hàng Admin
                      </h3>
                      <button onClick={() => setShowAdminAddBankForm(!showAdminAddBankForm)} className="text-[11px] font-bold text-brand-blue hover:underline"><i className="fa-solid fa-plus mr-0.5"></i> Thêm</button>

                        <div className="flex gap-2">
                          <button type="button" onClick={() => setShowAdminAddBankForm(false)} className="flex-1 py-2 bg-slate-100 text-brand-textSecondary rounded-xl text-xs font-bold">Huỷ</button>

                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}

                    {/* Products Admin */}
                    {adminCatalogTab === 'products' && (
                      <div className="space-y-2">
                        <button onClick={() => setProductFormModal({ mode: 'create', data: { ...emptyProductForm } })} className="px-4 py-2 gradient-blue text-white rounded-xl text-xs font-bold shadow-blue-sm"><i className="fa-solid fa-plus mr-1"></i> Thêm sản phẩm</button>
                        <div className="bg-white rounded-2xl border border-brand-border shadow-card overflow-x-auto">
                          <table className="w-full text-xs min-w-[600px]">
                            <thead><tr className="bg-brand-card border-b border-brand-border text-brand-textSecondary"><th className="py-2.5 px-3 text-left font-bold">Tên</th><th className="py-2.5 px-3 text-right font-bold">Giá</th><th className="py-2.5 px-3 text-right font-bold">Hoàn tiền</th><th className="py-2.5 px-3 text-center font-bold">Status</th><th className="py-2.5 px-3 text-center font-bold">Action</th></tr></thead>
                            <tbody className="divide-y divide-brand-border">
                              {adminProducts.map(p => (
                                <tr key={p.id} className="hover:bg-brand-card transition">
                                  <td className="py-2.5 px-3 font-bold text-brand-textPrimary max-w-[200px] truncate">{p.title}</td>
                                  <td className="py-2.5 px-3 text-right font-bold">{formatVND(p.price)}đ</td>

                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>

                          <tbody className="divide-y divide-brand-border">
                            {adminTasks.map(t => (
                              <tr key={t.id} className="hover:bg-brand-card transition">
                                <td className="py-2.5 px-3 font-black text-brand-blue">{t.level}</td>

                                <td className="py-2.5 px-3 text-center"><span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${t.status === 'ACTIVE' ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-100 text-slate-500'}`}>{t.status}</span></td>
                                <td className="py-2.5 px-3 text-center">

                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* ═══════════════════════════════════════════════════════════ */}
          {/* MODALS                                                     */}
          {/* ═══════════════════════════════════════════════════════════ */}

          {/* Withdraw Modal */}
          {showWithdrawModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in" onClick={() => setShowWithdrawModal(false)}>
              <div className="bg-white rounded-[28px] max-w-md w-full p-6 shadow-2xl space-y-4 relative max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between border-b border-brand-border pb-3">
                  <h3 className="font-black text-base text-brand-textPrimary flex items-center gap-2">
                    <i className="fa-solid fa-wallet text-brand-blue"></i> Rút Tiền
                  </h3>
                  <button onClick={() => setShowWithdrawModal(false)} className="text-brand-textSecondary hover:text-brand-textPrimary"><i className="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <form onSubmit={handleWithdrawSubmit} className="space-y-3.5">
                  <div>
                    <label className="block text-xs font-bold text-brand-textPrimary mb-1"><i className="fa-solid fa-building-columns text-brand-blue mr-1"></i>Ngân hàng</label>
                    <input value={withdrawForm.bank_name} readOnly required placeholder="Chọn ngân hàng..." className="w-full px-3 py-2.5 bg-brand-card border border-brand-border rounded-2xl text-xs font-semibold cursor-pointer" onClick={() => openBankPicker('withdraw')} />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-brand-textPrimary mb-1">Số tài khoản</label>
                    <input type="text" inputMode="numeric" required value={withdrawForm.account_number} onChange={e => setWithdrawForm({...withdrawForm, account_number: e.target.value.replace(/\D/g,'')})} placeholder="Nhập số tài khoản" className="w-full px-3 py-2.5 bg-brand-card border border-brand-border rounded-2xl text-xs font-mono font-semibold focus:outline-none focus:border-brand-blue" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-brand-textPrimary mb-1">Tên chủ TK (VIẾT HOA)</label>
                    <input type="text" required value={withdrawForm.account_holder} onChange={e => setWithdrawForm({...withdrawForm, account_holder: e.target.value.toUpperCase()})} placeholder="NGUYEN VAN A" className="w-full px-3 py-2.5 bg-brand-card border border-brand-border rounded-2xl text-xs font-bold uppercase focus:outline-none focus:border-brand-blue" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-brand-textPrimary mb-1"><i className="fa-solid fa-money-bill-wave text-emerald-500 mr-1"></i>Số tiền rút (VNĐ)</label>
                    <input type="number" required min={10000} step={1000} value={withdrawForm.amount} onChange={e => {
                      const raw = e.target.value;
                      const capMax = wallet ? Math.floor(Number(wallet.available)) : null;
                      if (raw !== '' && capMax !== null && !isNaN(capMax) && Number(raw) > capMax) { setWithdrawForm({...withdrawForm, amount: String(capMax)}); }
                      else { setWithdrawForm({...withdrawForm, amount: raw}); }
                    }} placeholder="Tối thiểu 10.000 VNĐ" className="w-full px-3 py-2.5 bg-brand-card border border-brand-border rounded-2xl text-xs font-bold text-brand-blue focus:outline-none focus:border-brand-blue" />
                    <p className="text-[10px] text-brand-textSecondary mt-1">Tối thiểu 10.000 VNĐ • Tối đa {wallet ? wallet.available_display || formatVND(wallet.available) : '—'}đ</p>
                  </div>

                  {wallet && wallet.has_withdrawal_pin && (
                    <div>
                      <label className="block text-xs font-bold text-brand-textPrimary mb-1"><i className="fa-solid fa-lock text-amber-500 mr-1"></i>Mã PIN rút tiền (6 số)</label>
                      <input type="password" inputMode="numeric" maxLength={6} placeholder="Nhập mã PIN 6 chữ số" value={withdrawForm.pin} onChange={e => setWithdrawForm({...withdrawForm, pin: e.target.value.replace(/[^0-9]/g, '').slice(0,6)})} className="w-full px-3 py-2.5 bg-brand-card border border-brand-border rounded-2xl text-xs font-semibold focus:outline-none focus:border-amber-500 tracking-[0.3em] text-center" required />
                    </div>
                  )}

                  {wallet && !wallet.has_withdrawal_pin && (
                    <div className="bg-amber-50 border border-amber-200 rounded-2xl p-2.5 text-[11px] text-amber-800 flex items-start gap-2">
                      <i className="fa-solid fa-triangle-exclamation text-amber-500 mt-0.5"></i>
                      <span>Bạn chưa đặt mã PIN rút tiền. <button type="button" onClick={() => { setShowWithdrawModal(false); setShowSetPinModal(true); }} className="text-brand-blue font-bold underline">Đặt PIN ngay</button></span>
                    </div>
                  )}

                  <button type="submit" disabled={withdrawSubmitting} className="w-full py-3.5 gradient-blue text-white rounded-2xl text-xs font-black shadow-blue hover:opacity-95 transition disabled:opacity-60 flex items-center justify-center gap-2">
                    {withdrawSubmitting && <i className="fa-solid fa-spinner fa-spin"></i>}
                    <span>Xác Nhận Yêu Cầu Rút Tiền</span>
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Bank Picker Modal */}
          {bankPickerTarget && (
            <div className="fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in" onClick={() => setBankPickerTarget(null)}>

                  <div><label className="text-xs font-bold text-brand-textPrimary block mb-1"><i className="fa-solid fa-key text-brand-blue mr-1"></i>Mật khẩu đăng nhập *</label><input type="password" required placeholder="Nhập mật khẩu để xác nhận" value={pinForm.password} onChange={e => setPinForm({...pinForm, password: e.target.value})} className="w-full px-3.5 py-2.5 bg-brand-card border border-brand-border rounded-2xl text-sm font-semibold focus:outline-none focus:border-brand-blue" /></div>
                  <div className="flex gap-2 pt-2 border-t border-brand-border">
                    <button type="button" onClick={() => { setShowSetPinModal(false); setPinForm({ pin:'', confirm_pin:'', password:'' }); }} className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-brand-textSecondary rounded-2xl font-bold text-sm transition">Huỷ</button>
                    <button type="submit" disabled={pinSubmitting} className="flex-1 py-2.5 bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-2xl font-black text-sm shadow-lg transition disabled:opacity-60 flex items-center justify-center gap-2">{pinSubmitting && <i className="fa-solid fa-spinner fa-spin"></i>}<span>Đặt PIN</span></button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Change PIN Modal */}
          {showChangePinModal && (
            <div className="fixed inset-0 z-[9999] bg-black/60 flex items-center justify-center p-4" onClick={e => { if (e.target === e.currentTarget) setShowChangePinModal(false); }}>
              <div className="bg-white rounded-[28px] max-w-md w-full p-6 shadow-2xl space-y-4 animate-fade-in max-h-[90vh] overflow-y-auto">
                <div className="text-center">
                  <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-500 text-white flex items-center justify-center text-2xl mx-auto mb-3 shadow-lg"><i className="fa-solid fa-arrows-rotate"></i></div>
                  <h2 className="text-lg font-black text-brand-textPrimary">Đổi Mã PIN Rút Tiền</h2>
                  <p className="text-xs text-brand-textSecondary mt-1">Nhập mã PIN cũ và mã PIN mới 6 chữ số.</p>
                </div>
                <form onSubmit={handleChangePin} className="space-y-3">
                  <div><label className="text-xs font-bold text-brand-textPrimary block mb-1">Mã PIN cũ *</label><input type="password" inputMode="numeric" maxLength={6} required placeholder="••••••" value={changePinForm.old_pin} onChange={e => setChangePinForm({...changePinForm, old_pin: e.target.value.replace(/[^0-9]/g,'').slice(0,6)})} className="w-full px-3.5 py-2.5 bg-brand-card border border-brand-border rounded-2xl text-sm font-semibold focus:outline-none focus:border-amber-500 tracking-[0.3em] text-center" /></div>
                  <div><label className="text-xs font-bold text-brand-textPrimary block mb-1">Mã PIN mới *</label><input type="password" inputMode="numeric" maxLength={6} required placeholder="••••••" value={changePinForm.new_pin} onChange={e => setChangePinForm({...changePinForm, new_pin: e.target.value.replace(/[^0-9]/g,'').slice(0,6)})} className="w-full px-3.5 py-2.5 bg-brand-card border border-brand-border rounded-2xl text-sm font-semibold focus:outline-none focus:border-amber-500 tracking-[0.3em] text-center" /></div>
                  <div><label className="text-xs font-bold text-brand-textPrimary block mb-1">Xác nhận PIN mới *</label><input type="password" inputMode="numeric" maxLength={6} required placeholder="••••••" value={changePinForm.confirm_new_pin} onChange={e => setChangePinForm({...changePinForm, confirm_new_pin: e.target.value.replace(/[^0-9]/g,'').slice(0,6)})} className="w-full px-3.5 py-2.5 bg-brand-card border border-brand-border rounded-2xl text-sm font-semibold focus:outline-none focus:border-amber-500 tracking-[0.3em] text-center" /></div>
                  <div className="flex gap-2 pt-2 border-t border-brand-border">
                    <button type="button" onClick={() => { setShowChangePinModal(false); setChangePinForm({ old_pin:'', new_pin:'', confirm_new_pin:'' }); }} className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-brand-textSecondary rounded-2xl font-bold text-sm transition">Huỷ</button>
                    <button type="submit" disabled={pinSubmitting} className="flex-1 py-2.5 bg-gradient-to-r from-blue-500 to-indigo-500 text-white rounded-2xl font-black text-sm shadow-lg transition disabled:opacity-60 flex items-center justify-center gap-2">{pinSubmitting && <i className="fa-solid fa-spinner fa-spin"></i>}<span>Đổi PIN</span></button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ─── FOOTER ─── */}
          <footer className="bg-brand-dark text-slate-300 pt-10 pb-8 border-t border-brand-darkBorder mt-10">
            <div className="max-w-7xl mx-auto px-4 lg:px-6 space-y-8">
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 text-xs">
                <div className="space-y-3">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-lg gradient-blue flex items-center justify-center text-white font-bold"><i className="fa-solid fa-bolt text-xs"></i></div>
                    <span className="font-black text-base text-white">PaybackGo</span>
                  </div>
                  <p className="text-slate-400 leading-relaxed">Nền tảng tiếp thị liên kết Shopee và đối tác tài chính ngân hàng Accesstrade.</p>
                </div>
                <div className="space-y-2">
                  <h4 className="font-bold text-sm text-white border-b border-brand-blue/50 pb-1.5 inline-block">SHOPEE AFFILIATE</h4>
                  <ul className="space-y-1.5 text-slate-400"><li>• Shopee Mall chính hãng hoàn tiền</li><li>• Voucher độc quyền thành viên</li></ul>
                </div>
                <div className="space-y-2">
                  <h4 className="font-bold text-sm text-white border-b border-brand-blue/50 pb-1.5 inline-block">ACCESSTRADE HUB</h4>
                  <ul className="space-y-1.5 text-slate-400"><li>• Mở tài khoản ngân hàng 0đ</li><li>• Thẻ tín dụng, ví điện tử, đầu tư</li></ul>
                </div>
                <div className="space-y-2">
                  <h4 className="font-bold text-sm text-white border-b border-brand-blue/50 pb-1.5 inline-block">TÀI KHOẢN</h4>
                  <p className="text-slate-400">Đăng nhập bảo mật bằng JWT.</p>
                </div>
              </div>
              <div className="border-t border-slate-800 pt-5 flex flex-col md:flex-row items-center justify-between gap-3 text-[11px] text-slate-400">
                <p>&copy; 2026 PaybackGo Hub. Đối soát Shopee & Accesstrade minh bạch.</p>
                <div className="flex items-center gap-3"><span>Bảo mật JWT</span><span>|</span><span>Chuyển khoản ngân hàng</span></div>
              </div>
            </div>
          </footer>

          {/* ─── MOBILE BOTTOM NAV ─── */}
          <div className="mobile-bottom-nav lg:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-brand-border py-2 px-3 flex items-center justify-around shadow-2xl will-change-transform" style={{transform:'translateZ(0)'}}>
            <button onClick={() => setCurrentTab('trang_chu')} className={`flex flex-col items-center gap-1 ${currentTab === 'trang_chu' ? 'text-brand-blue font-bold' : 'text-brand-textSecondary'}`}>
              <i className={`fa-solid fa-house ${currentTab === 'trang_chu' ? 'text-lg' : 'text-base'}`}></i><span className="text-[10px]">Trang chủ</span>
            </button>
            <button onClick={() => setCurrentTab('don_hang')} className={`flex flex-col items-center gap-1 ${currentTab === 'don_hang' ? 'text-brand-blue font-bold' : 'text-brand-textSecondary'}`}>
              <i className={`fa-solid fa-bag-shopping ${currentTab === 'don_hang' ? 'text-lg' : 'text-base'}`}></i><span className="text-[10px]">Đơn hàng</span>
            </button>
            <button onClick={() => setCurrentTab('gioi_thieu_ctv')} className={`flex flex-col items-center gap-1 ${currentTab === 'gioi_thieu_ctv' ? 'text-brand-blue font-bold' : 'text-brand-textSecondary'}`}>
              <i className={`fa-solid fa-users ${currentTab === 'gioi_thieu_ctv' ? 'text-lg' : 'text-base'}`}></i><span className="text-[10px]">Giới thiệu</span>
            </button>
            <button onClick={() => setCurrentTab('accesstrade_hub')} className={`flex flex-col items-center gap-1 ${currentTab === 'accesstrade_hub' ? 'text-brand-blue font-bold' : 'text-brand-textSecondary'}`}>
              <i className={`fa-solid fa-list-check ${currentTab === 'accesstrade_hub' ? 'text-lg' : 'text-base'}`}></i><span className="text-[10px]">Nhiệm vụ</span>
            </button>
            <button onClick={() => setCurrentTab('tai_khoan')} className={`flex flex-col items-center gap-1 ${currentTab === 'tai_khoan' ? 'text-brand-blue font-bold' : 'text-brand-textSecondary'}`}>
              <i className={`fa-solid fa-user ${currentTab === 'tai_khoan' ? 'text-lg' : 'text-base'}`}></i><span className="text-[10px]">Tài khoản</span>
            </button>
          </div>

          {/* ─── TOAST ─── */}
          {toastMessage && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[9999] bg-brand-textPrimary text-white text-xs font-bold px-5 py-3 rounded-2xl shadow-2xl toast-enter max-w-sm text-center">
              {toastMessage}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
