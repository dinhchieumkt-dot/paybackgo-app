  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;

    .badge-shopee-live { background: #FF5722; color: #FFFFFF; font-weight: 800; }
    .animate-bounce-slow {
      animation: bounce 2.2s infinite;
    }

    /* Custom Scrollbar */

      width: 6px;

    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }

      border-radius: 9999px;

    /* ============================================================
       PWA + RESPONSIVE (MỤC B)
       Toàn bộ layout chính đã dùng Tailwind (sm:/md:/lg: ...) nên đã
       responsive sẵn. Khối dưới đây chỉ BỔ SUNG các phần Tailwind
       không tự lo được: an toàn notch iOS khi mở app từ màn hình
       chính (standalone), chống tràn ngang, vùng chạm đủ lớn trên
       mobile, và giới hạn/co giãn cỡ chữ ở 2 đầu màn hình rất nhỏ
       hoặc rất lớn.
       ============================================================ */

    /* Không cho toàn trang cuộn ngang dù có phần tử nào bị tràn */
    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }
    img, svg {
      max-width: 100%;
      height: auto;
    }

    /* Khi cài thành App (standalone) trên iPhone có tai thỏ/Dynamic
       Island: chừa khoảng an toàn 2 bên và dưới cùng, tránh nút bị
       che bởi thanh cử chỉ / notch. Chỉ áp dụng khi chạy như app
       (display-mode: standalone), không ảnh hưởng khi mở bằng trình
       duyệt bình thường. */
    @supports (padding: max(0px)) {
      body {
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    }
    @media all and (display-mode: standalone) {
      body {
        padding-top: env(safe-area-inset-top);
      }
      /* Thanh điều hướng dưới cùng trên mobile: cộng thêm khoảng an
         toàn để không bị thanh cử chỉ của iPhone che mất. Đổi
         `.mobile-bottom-nav` thành đúng class/khối bạn dùng cho
         thanh nav dưới cùng nếu tên khác. */
      .mobile-bottom-nav {
        padding-bottom: calc(0.5rem + env(safe-area-inset-bottom));
      }
    }

    /* -------- Mobile: ≤ 640px (điện thoại) -------- */
    @media (max-width: 640px) {
      body {
        font-size: 15px;
      }
      /* Vùng chạm tối thiểu 44x44px theo chuẩn Apple/Google HIG cho
         mọi nút bấm và link trên mobile, để ngón tay bấm không nhầm */
      button, a[role="button"], .btn, input[type="submit"] {
        min-height: 44px;
      }
      input, select, textarea {
        font-size: 16px !important;
      }
      /* Khoảng cách các khối nội dung thoáng hơn trên màn hình hẹp */
      .quest-card-glow, .rounded-3xl, .rounded-2xl {
        padding-left: 1rem;
        padding-right: 1rem;
      }
    }

    /* -------- Tablet: 641px – 1024px -------- */
    @media (min-width: 641px) and (max-width: 1024px) {
      body {
        font-size: 15.5px;
      }
    }

    /* -------- Desktop lớn: ≥ 1536px -------- */
    /* Tailwind đã giới hạn nội dung ở max-w-7xl (~1280px) và canh
       giữa (mx-auto) nên trên màn hình rất rộng nội dung không bị
       kéo giãn/vỡ chữ - khối này chỉ nới cỡ chữ cơ bản một chút cho
       dễ đọc trên màn hình lớn, không đổi bố cục. */
    @media (min-width: 1536px) {
      body {
        font-size: 16.5px;
      }
    }
  </style>

  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<body class="text-slate-800 antialiased selection:bg-blue-600 selection:text-white pb-20 lg:pb-0">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ==========================================================================
    // CẤU HÌNH & TIỆN ÍCH GỌI API THẬT (BACKEND FASTAPI THẬT - KHÔNG MOCK DATA)
    // ==========================================================================
    const API_BASE = 'https://paybackgo.store';

    const formatVND = (amount) => {
      const val = Math.round(Number(amount) || 0);
      return val.toLocaleString('vi-VN') + ' VNĐ';
    };

    function getDeviceToken() {
      let t = localStorage.getItem('pbg_device_token');
      if (!t) {
        t = 'web-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
        localStorage.setItem('pbg_device_token', t);
      }
      return t;
    }

    function getToken() {
      return localStorage.getItem('pbg_token') || '';
    }

    function setSession(token) {
      localStorage.setItem('pbg_token', token);
    }

    function clearSession() {
      localStorage.removeItem('pbg_token');
    }

    class ApiError extends Error {
      constructor(message, status) {
        super(message);
        this.status = status;
      }
    }

    async function apiFetch(path, options = {}) {
      const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
      const token = getToken();
      if (token) headers['Authorization'] = 'Bearer ' + token;

      let res;
      try {
        res = await fetch(API_BASE + path, {
          method: options.method || 'GET',
          headers,
          body: options.body ? JSON.stringify(options.body) : undefined,
        });
      } catch (e) {
        throw new ApiError('Không kết nối được máy chủ PaybackGo. Vui lòng kiểm tra mạng.', 0);
      }

      if (res.status === 204) return null;

      let data = null;
      try { data = await res.json(); } catch (e) { /* no body */ }

      if (!res.ok) {
        let msg = (data && (data.detail || data.message)) || `Lỗi máy chủ (${res.status})`;
        if (Array.isArray(msg)) msg = msg.map(m => m.msg).join(', ');
        if (res.status === 401) {
          clearSession();
        }
        throw new ApiError(msg, res.status);
      }
      return data;
    }

    // ==========================================================================
    // APP
    // ==========================================================================
    function App() {
      // ---- PHIÊN ĐĂNG NHẬP THẬT (JWT) ----
      const [authChecked, setAuthChecked] = useState(false);
      const [currentUser, setCurrentUser] = useState(null); // null = chưa đăng nhập
      const [authView, setAuthView] = useState('login'); // 'login' | 'register'
      const [authForm, setAuthForm] = useState({ username: '', password: '', display_name: '', email: '', referral_code: '' });
      const [authSubmitting, setAuthSubmitting] = useState(false);
      const [authError, setAuthError] = useState('');

      const [currentTab, setCurrentTab] = useState('trang_chu');

      const [toastMessage, setToastMessage] = useState(null);
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      const copyToClipboard = (text, msg = 'Đã sao chép vào bộ nhớ tạm!') => {
        try {
          const temp = document.createElement('input');
          temp.value = text;
          document.body.appendChild(temp);
          temp.select();
          document.execCommand('copy');
          document.body.removeChild(temp);
          showToast(msg);
        } catch (e) {
          showToast('Sao chép thất bại!');
        }
      };

      // ---- Tự động khôi phục phiên khi tải trang ----
      useEffect(() => {
        (async () => {
          const token = getToken();
          if (!token) { setAuthChecked(true); return; }
          try {
            const profile = await apiFetch('/api/v1/auth/profile');
            setCurrentUser(profile);
          } catch (e) {
            clearSession();
          } finally {
            setAuthChecked(true);
          }
        })();
      }, []);

      // Đọc mã giới thiệu từ URL (?ref=XXXX) để tự điền lúc đăng ký
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const ref = params.get('ref');
        if (ref) {
          setAuthForm(prev => ({ ...prev, referral_code: ref }));
          setAuthView('register');
        }
      }, []);

      const refreshProfile = async () => {
        try {
          const profile = await apiFetch('/api/v1/auth/profile');
          setCurrentUser(profile);
          return profile;
        } catch (e) { return null; }
      };

      const handleLogin = async (e) => {
        if (e) e.preventDefault();
        if (!authForm.username || !authForm.password) {
          setAuthError('Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.');
          return;
        }
        setAuthSubmitting(true);
        setAuthError('');
        try {
          const res = await apiFetch('/api/v1/auth/login', {
            method: 'POST',
            body: { username: authForm.username.trim(), password: authForm.password, device_token: getDeviceToken() },
          });
          setSession(res.access_token);
          const profile = await apiFetch('/api/v1/auth/profile');
          setCurrentUser(profile);
          setCurrentTab(profile.role === 'ADMIN' ? 'admin_portal' : 'trang_chu');
          showToast(`🎉 Đăng nhập thành công! Xin chào ${profile.display_name || profile.username}.`);
        } catch (err) {
          setAuthError(err.message || 'Đăng nhập thất bại.');
        } finally {
          setAuthSubmitting(false);
        }
      };

      const handleRegister = async (e) => {
        if (e) e.preventDefault();
        if (!authForm.username || !authForm.password) {
          setAuthError('Vui lòng nhập tên đăng nhập và mật khẩu.');
          return;
        }
        if (authForm.password.length < 6) {
          setAuthError('Mật khẩu phải có tối thiểu 6 ký tự.');
          return;
        }
        setAuthSubmitting(true);
        setAuthError('');
        try {
          await apiFetch('/api/v1/auth/register', {
            method: 'POST',
            body: {
              username: authForm.username.trim(),
              password: authForm.password,
              display_name: authForm.display_name.trim() || undefined,
              email: authForm.email.trim() || undefined,
              referral_code: authForm.referral_code.trim() || undefined,
              device_token: getDeviceToken(),
            },
          });
          // Đăng ký xong tự động đăng nhập luôn
          const res = await apiFetch('/api/v1/auth/login', {
            method: 'POST',
            body: { username: authForm.username.trim(), password: authForm.password, device_token: getDeviceToken() },
          });
          setSession(res.access_token);
          const profile = await apiFetch('/api/v1/auth/profile');
          setCurrentUser(profile);
          showToast(`🎉 Tạo tài khoản thành công! Chào mừng ${profile.display_name || profile.username} đến với PaybackGo.`);
        } catch (err) {
          setAuthError(err.message || 'Đăng ký thất bại.');
        } finally {
          setAuthSubmitting(false);
        }
      };

      const handleLogout = () => {
        clearSession();
        setCurrentUser(null);
        setCurrentTab('trang_chu');
        setAuthForm({ username: '', password: '', display_name: '', email: '', referral_code: '' });
        showToast('Đã đăng xuất tài khoản.');
      };

      // ---- VÍ (THẬT) ----
      const [wallet, setWallet] = useState(null);
      const [walletLoading, setWalletLoading] = useState(false);
      const loadWallet = async () => {
        setWalletLoading(true);
        try {
          const data = await apiFetch('/api/v1/user/wallet');
          setWallet(data);
        } catch (err) {
          showToast(err.message || 'Không tải được ví.');
        } finally {
          setWalletLoading(false);
        }
      };

      useEffect(() => {
        if (currentUser) { loadWallet(); }
      }, [currentUser && currentUser.id]);

      const [showWithdrawModal, setShowWithdrawModal] = useState(false);
      const [showAccountMenu, setShowAccountMenu] = useState(false);
      const [withdrawForm, setWithdrawForm] = useState({ bank_name: 'Vietcombank', account_number: '', account_name: '', amount: '' });
      const [withdrawSubmitting, setWithdrawSubmitting] = useState(false);

      const handleWithdrawSubmit = async (e) => {
        e.preventDefault();
        const amt = parseInt(withdrawForm.amount, 10);
        const walletAvailableNum = wallet ? Number(wallet.available) : 0;
        if (!withdrawForm.bank_name) {
          showToast('Vui lòng chọn ngân hàng / ví nhận tiền!');
          return;
        }
        if (!withdrawForm.account_number || !withdrawForm.account_name || !amt) {
          showToast('Vui lòng điền đầy đủ thông tin nhận tiền!');
          return;
        }
        if (!/^[0-9]{6,19}$/.test(withdrawForm.account_number)) {
          showToast('Số tài khoản / số điện thoại ví không hợp lệ (chỉ gồm 6-19 chữ số).');
          return;
        }
        if (!/^[A-Z\s]{2,60}$/.test(withdrawForm.account_name)) {
          showToast('Tên chủ tài khoản không hợp lệ (chỉ gồm chữ cái in hoa không dấu và khoảng trắng).');
          return;
        }
        if (amt < 10000) {
          showToast('Số tiền rút tối thiểu là 10.000 VNĐ!');
          return;
        }
        if (walletAvailableNum > 0 && amt > walletAvailableNum) {
          showToast('Số tiền rút vượt quá số dư khả dụng trong ví!');
          return;
        }
        setWithdrawSubmitting(true);
        try {
          const res = await apiFetch('/api/v1/user/withdraw', {
            method: 'POST',
            body: {
              bank_name: withdrawForm.bank_name,
              account_number: withdrawForm.account_number.trim(),
              account_name: withdrawForm.account_name.trim().toUpperCase(),
              amount: amt,
              device_token: getDeviceToken(),
            },
          });
          showToast('✅ ' + res.message);
          setShowWithdrawModal(false);
          setWithdrawForm({ bank_name: 'Vietcombank', account_number: '', account_name: '', amount: '' });
          loadWallet();
        } catch (err) {
          showToast(err.message || 'Rút tiền thất bại.');
        } finally {
          setWithdrawSubmitting(false);
        }
      };

      const [userBanks, setUserBanks] = useState(null);
      const [userBanksLoading, setUserBanksLoading] = useState(false);
      const loadUserBanks = async () => {
        setUserBanksLoading(true);
        try {
          const data = await apiFetch('/api/v1/user/banks');
          setUserBanks(data);
        } catch (err) {
          setUserBanks([]);
        } finally {
          setUserBanksLoading(false);
        }
      };

      const [newUserBankForm, setNewUserBankForm] = useState({ bank_name: '', account_number: '', account_name: '' });
      const [addUserBankSubmitting, setAddUserBankSubmitting] = useState(false);

      const submitAddUserBank = async (e) => {
        e.preventDefault();
        if (!newUserBankForm.bank_name) {
          showToast('Vui lòng chọn ngân hàng / ví!');
          return;
        }
        if (!/^[0-9]{6,19}$/.test(newUserBankForm.account_number)) {
          showToast('Số tài khoản không hợp lệ (chỉ gồm 6-19 chữ số).');
          return;
        }
        if (!/^[A-Z\s]{2,60}$/.test(newUserBankForm.account_name)) {
          showToast('Tên chủ tài khoản không hợp lệ (chỉ gồm chữ cái in hoa không dấu và khoảng trắng).');
          return;
        }
        setAddUserBankSubmitting(true);
        try {
          await apiFetch('/api/v1/user/banks', {
            method: 'POST',
            body: {
              bank_name: newUserBankForm.bank_name,
              account_number: newUserBankForm.account_number.trim(),
              account_name: newUserBankForm.account_name.trim().toUpperCase(),
            },
          });
          showToast('✅ Đã lưu tài khoản ngân hàng!');
          setNewUserBankForm({ bank_name: '', account_number: '', account_name: '' });
          loadUserBanks();
        } catch (err) {
          showToast(err.message || 'Lưu tài khoản thất bại.');
        } finally {
          setAddUserBankSubmitting(false);
        }
      };

      const setDefaultUserBank = async (bank) => {
        try {
          await apiFetch(`/api/v1/user/banks/${bank.id}/default`, { method: 'PATCH' });
          loadUserBanks();
        } catch (err) {
          showToast(err.message || 'Không đặt được mặc định.');
        }
      };

      const deleteUserBank = async (bank) => {
        try {
          await apiFetch(`/api/v1/user/banks/${bank.id}`, { method: 'DELETE' });
          loadUserBanks();
        } catch (err) {
          showToast(err.message || 'Không xoá được tài khoản.');
        }
      };

      useEffect(() => {
        if (currentTab === 'vi_tien' && userBanks === null) {
          loadUserBanks();
        }
      }, [currentTab]);

      // ---- CHUỖI TIẾN CẤP 10 TRIỆU (THẬT) ----
      const [tasks, setTasks] = useState(null);
      const [tasksLoading, setTasksLoading] = useState(false);
      const [selectedQuestModal, setSelectedQuestModal] = useState(null);
      const [completingTaskId, setCompletingTaskId] = useState(null);

      const loadTasks = async () => {
        setTasksLoading(true);
        try {
          const data = await apiFetch('/api/v1/tasks/list');
          setTasks(data);
        } catch (err) {
          showToast(err.message || 'Không tải được danh sách nhiệm vụ.');
        } finally {
          setTasksLoading(false);
        }
      };

      const handleCompleteTask = async (task) => {
        setCompletingTaskId(task.id);
        try {
          const res = await apiFetch('/api/v1/tasks/complete/' + task.id, { method: 'POST' });
          showToast('🎉 ' + res.message);
          setSelectedQuestModal(null);
          await Promise.all([loadTasks(), loadWallet()]);
        } catch (err) {
          showToast(err.message || 'Không thể hoàn thành nhiệm vụ.');
        } finally {
          setCompletingTaskId(null);
        }
      };

      // ---- NHIỆM VỤ ACCESSTRADE (THẬT) ----
      const [campaigns, setCampaigns] = useState(null);
      const [campaignsLoading, setCampaignsLoading] = useState(false);
      const [selectedAtCategory, setSelectedAtCategory] = useState('all');
      const [activeCampaignModal, setActiveCampaignModal] = useState(null);
      const [completingCampaignId, setCompletingCampaignId] = useState(null);

      const loadCampaigns = async () => {
        setCampaignsLoading(true);
        try {
          const data = await apiFetch('/api/v1/campaigns/list');
          setCampaigns(data.campaigns);
        } catch (err) {
          showToast(err.message || 'Không tải được danh sách chiến dịch.');
        } finally {
          setCampaignsLoading(false);
        }
      };

      const handleCompleteCampaign = async (camp) => {
        setCompletingCampaignId(camp.id);
        try {
          const res = await apiFetch('/api/v1/campaigns/' + camp.id + '/complete', { method: 'POST' });
          showToast('🎉 ' + res.message);
          setActiveCampaignModal(null);
          await Promise.all([loadCampaigns(), loadWallet()]);
        } catch (err) {
          showToast(err.message || 'Không thể xác nhận hoàn thành.');
        } finally {

            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">

                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 className="font-black text-base text-slate-900">

                  <button onClick={() => setProductFormModal(null)} className="text-slate-400 hover:text-slate-600">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <form onSubmit={submitProductForm} className="grid grid-cols-1 sm:grid-cols-2 gap-3.5 text-xs">
                  <div className="sm:col-span-2">
                    <label className="font-bold text-slate-700 block mb-1">Tên sản phẩm *</label>
                    <input required value={productFormModal.data.title} onChange={(e) => setProductFormModal({ ...productFormModal, data: { ...productFormModal.data, title: e.target.value } })} className="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold focus:outline-none focus:border-blue-500" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Thương hiệu</label>
                    <input value={productFormModal.data.brand} onChange={(e) => setProductFormModal({ ...productFormModal, data: { ...productFormModal.data, brand: e.target.value } })} className="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold focus:outline-none focus:border-blue-500" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Nhãn nền tảng</label>
                    <input value={productFormModal.data.platform_label} onChange={(e) => setProductFormModal({ ...productFormModal, data: { ...productFormModal.data, platform_label: e.target.value } })} placeholder="SHOPEE MALL" className="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold focus:outline-none focus:border-blue-500" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Giá (VNĐ)</label>

                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Giá gốc (VNĐ, tuỳ chọn)</label>
                    <input type="number" value={productFormModal.data.old_price || ''} onChange={(e) => setProductFormModal({ ...productFormModal, data: { ...productFormModal.data, old_price: e.target.value } })} className="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold focus:outline-none focus:border-blue-500" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Hoàn tiền ước tính (VNĐ)</label>

                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Text đã bán</label>

                  </div>
                  <div className="sm:col-span-2">
                    <label className="font-bold text-slate-700 block mb-1">Link ảnh sản phẩm</label>

                  <div>

                  <div>

                    <button type="submit" disabled={productFormSubmitting} className="flex-1 py-2.5 gradient-blue text-white rounded-xl font-black shadow transition disabled:opacity-60 flex items-center justify-center gap-2">
                      {productFormSubmitting && <i className="fa-solid fa-spinner fa-spin"></i>}
                      <span>{productFormModal.mode === 'create' ? 'Thêm sản phẩm' : 'Lưu thay đổi'}</span>
                    </button>
                  </div>
                </form>
              </div>

                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 className="font-black text-base text-slate-900">Sửa Nhiệm Vụ — Mức {taskFormModal.data.level}</h3>
                  <button onClick={() => setTaskFormModal(null)} className="text-slate-400 hover:text-slate-600">

                </div>

                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Nguồn (source)</label>

                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Hạng (tier)</label>
                    <input value={taskFormModal.data.tier} onChange={(e) => setTaskFormModal({ ...taskFormModal, data: { ...taskFormModal.data, tier: e.target.value } })} className="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold focus:outline-none focus:border-blue-500" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Màu hạng (tier_color, class Tailwind)</label>
                    <input value={taskFormModal.data.tier_color} onChange={(e) => setTaskFormModal({ ...taskFormModal, data: { ...taskFormModal.data, tier_color: e.target.value } })} className="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono font-semibold focus:outline-none focus:border-blue-500" />
                  </div>
                  <div className="sm:col-span-2">
                    <label className="font-bold text-slate-700 block mb-1">Link đối tác thật (action_url) — dán link Accesstrade THẬT ở đây</label>
                    <input value={taskFormModal.data.action_url} onChange={(e) => setTaskFormModal({ ...taskFormModal, data: { ...taskFormModal.data, action_url: e.target.value } })} placeholder="https://go.acesstrade.vn/..." className="w-full px-3 py-2.5 bg-amber-50 border border-amber-300 rounded-xl font-mono font-semibold focus:outline-none focus:border-blue-500" />
                  </div>
                  <div className="sm:col-span-2">
                    <label className="font-bold text-slate-700 block mb-1">Nhãn nút bấm (action_label)</label>
                    <input value={taskFormModal.data.action_label} onChange={(e) => setTaskFormModal({ ...taskFormModal, data: { ...taskFormModal.data, action_label: e.target.value } })} className="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold focus:outline-none focus:border-blue-500" />
                  </div>
                  <div className="sm:col-span-2">
                    <label className="font-bold text-slate-700 block mb-1">Hướng dẫn các bước (mỗi dòng 1 bước)</label>

                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Trạng thái</label>
                    <select value={taskFormModal.data.status} onChange={(e) => setTaskFormModal({ ...taskFormModal, data: { ...taskFormModal.data, status: e.target.value } })} className="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold focus:outline-none focus:border-blue-500">
                      <option value="ACTIVE">ACTIVE</option>
                      <option value="INACTIVE">INACTIVE</option>
                    </select>
                  </div>

                  <div className="sm:col-span-2 pt-2 border-t border-slate-100 flex gap-2">
                    <button type="button" onClick={() => setTaskFormModal(null)} className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition">Huỷ</button>
                    <button type="submit" disabled={taskFormSubmitting} className="flex-1 py-2.5 gradient-blue text-white rounded-xl font-black shadow transition disabled:opacity-60 flex items-center justify-center gap-2">
                      {taskFormSubmitting && <i className="fa-solid fa-spinner fa-spin"></i>}
                      <span>Lưu thay đổi</span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

            <div className="max-w-7xl mx-auto px-4 lg:px-6 space-y-8">
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 text-xs">
                <div className="space-y-3">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-lg gradient-blue flex items-center justify-center text-white font-bold">
                      <i className="fa-solid fa-bolt text-xs"></i>
                    </div>
                    <span className="font-black text-base text-white">PaybackGo</span>
                  </div>
                  <p className="text-slate-400 leading-relaxed">
                    Nền tảng tiếp thị liên kết Shopee và đối tác tài chính ngân hàng Accesstrade.
                  </p>
                </div>

                <div className="space-y-2">
                  <h4 className="font-bold text-sm text-white border-b border-blue-500/50 pb-1.5 inline-block">SHOPEE AFFILIATE</h4>
                  <ul className="space-y-1.5 text-slate-400">
                    <li>• Shopee Mall chính hãng hoàn tiền</li>
                    <li>• Voucher độc quyền thành viên</li>
                  </ul>
                </div>

                <div className="space-y-2">
                  <h4 className="font-bold text-sm text-white border-b border-blue-500/50 pb-1.5 inline-block">ACCESSTRADE HUB</h4>

                    <li>• Mở tài khoản ngân hàng 0đ</li>
                    <li>• Thẻ tín dụng, ví điện tử, đầu tư</li>
                  </ul>

                <div className="space-y-2">
                  <h4 className="font-bold text-sm text-white border-b border-blue-500/50 pb-1.5 inline-block">TÀI KHOẢN</h4>
                  <p className="text-slate-400">Đăng nhập bằng tên đăng nhập & mật khẩu, phiên đăng nhập bảo mật bằng JWT.</p>
                </div>
              </div>

              <div className="border-t border-slate-800 pt-5 flex flex-col md:flex-row items-center justify-between gap-3 text-[11px] text-slate-400">
                <p>© 2026 PaybackGo Hub. Đối soát Shopee & Accesstrade minh bạch.</p>
                <div className="flex items-center gap-3">
                  <span>🔒 Bảo mật đăng nhập JWT</span>
                  <span>|</span>
                  <span>🏦 Chuyển khoản ngân hàng</span>
                </div>
              </div>
            </div>
          </footer>

          <div className="mobile-bottom-nav lg:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 py-2 px-3 flex items-center justify-around shadow-2xl will-change-transform [transform:translateZ(0)]">
            <button
              onClick={() => setCurrentTab('trang_chu')}
              className={`flex flex-col items-center gap-1 ${currentTab === 'trang_chu' ? 'text-blue-600 font-bold' : 'text-slate-500'}`}
            >
              <i className="fa-solid fa-house text-base"></i>
              <span className="text-[10px]">Trang chủ</span>
            </button>
            <button
              onClick={() => setCurrentTab('gioi_thieu_ctv')}
              className={`flex flex-col items-center gap-1 ${currentTab === 'gioi_thieu_ctv' ? 'text-blue-600 font-bold' : 'text-slate-500'}`}
            >
              <i className="fa-solid fa-users text-base"></i>
              <span className="text-[10px]">Giới thiệu</span>
            </button>
            <button
              onClick={() => setCurrentTab('vi_tien')}
              className={`flex flex-col items-center gap-1 ${currentTab === 'vi_tien' ? 'text-blue-600 font-bold' : 'text-slate-500'}`}
            >
              <i className="fa-solid fa-wallet text-base"></i>
              <span className="text-[10px]">Ví & Rút</span>
            </button>
            <button
              onClick={() => setCurrentTab('accesstrade_hub')}
              className={`flex flex-col items-center gap-1 ${currentTab === 'accesstrade_hub' ? 'text-blue-600 font-bold' : 'text-slate-500'}`}
            >
              <i className="fa-solid fa-coins text-base"></i>
              <span className="text-[10px]">Nhiệm vụ</span>
            </button>
            <button
              onClick={() => setCurrentTab('shopee_hub')}
              className={`flex flex-col items-center gap-1 ${currentTab === 'shopee_hub' ? 'text-blue-600 font-bold' : 'text-slate-500'}`}
            >
              <i className="fa-solid fa-bolt text-base"></i>
              <span className="text-[10px]">Flash Sale</span>
            </button>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
